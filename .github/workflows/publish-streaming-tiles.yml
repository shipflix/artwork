name: Publish approved streaming tiles
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: artwork-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test tile-only publishing
        run: python3 -m unittest discover -s tests -p test_streaming_patch.py -v
      - name: Retrieve last successful complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != null
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name github-pages --dir previous
          mkdir _site
          tar -xf previous/artifact.tar -C _site
      - name: Replace only streaming tiles and verify preservation
        run: python3 scripts/publish_streaming_tiles.py _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
          retention-days: 1
      - name: Deploy approved tiles
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
